<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Billikens Passing Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy: #003DA5;      /* SLU Blue — PMS 293C, official primary */
    --navy-light: #235FC4; /* lighter tint of SLU Blue for secondary chrome */
    --navy-deep: #00244D;  /* Grand Blue — official SLU secondary, for depth */
    --gold: #FFC72C;      /* Gateway Gold — official SLU secondary */
    --gold-deep: #E6AC00;
    --bg: #EEF0F3;
    --card: #FFFFFF;
    --line: #C8C9C7;      /* College Church Gray — official SLU neutral */
    --ink: #101828;
    --ink-soft: #5B6472;

    --v0: #B7382B;
    --v1: #DB8A2E;
    --v2: #8FB33E;
    --v3: #1F8F4E;

    --s1: #2D5FA3;
    --s2: #7A4FBE;
    --s3: #1E8E7E;
    --s4: #C9791E;
    --s5: #C23B6B;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  input{-webkit-user-select:text;user-select:text;}

  .display{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-weight:800;text-transform:uppercase;letter-spacing:0.04em;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- Scoreboard header ---------- */
  header.scoreboard{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;padding:14px 18px 12px;
    border-bottom:4px solid var(--gold);
    position:sticky;top:0;z-index:20;
  }
  .scoreboard-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .display{font-size:19px;letter-spacing:0.06em;}
  .brand .sub{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;}
  .set-flip{
    background:var(--navy-deep);border:2px solid var(--gold);border-radius:8px;
    padding:6px 14px;text-align:center;min-width:88px;
  }
  .set-flip .lbl{font-size:9px;letter-spacing:0.16em;color:var(--gold);font-weight:700;}
  .set-flip .val{font-size:22px;font-weight:800;line-height:1.1;}

  /* ---------- Tabs ---------- */
  nav.tabs{display:flex;background:var(--navy-light);position:sticky;top:64px;z-index:19;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  nav.tabs button{
    flex:1;border:none;background:transparent;color:rgba(255,255,255,0.65);
    padding:13px 8px;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  nav.tabs button.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,0.06);}

  main{max-width:1100px;margin:0 auto;padding:16px 14px 60px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  /* ---------- Toolbar (Tab 1) ---------- */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;}
  .set-picker{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;}
  .set-picker button{
    border:none;background:transparent;padding:9px 13px;border-radius:7px;font-weight:800;
    color:var(--ink-soft);font-size:14px;cursor:pointer;min-width:44px;
  }
  .set-picker button.active{background:var(--navy);color:#fff;}
  .set-picker button.active::after{content:none;}

  button.pill{
    border:none;border-radius:9px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;
    letter-spacing:0.02em;
  }
  #undoBtn{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  #undoBtn:active{background:var(--navy);color:#fff;}
  #undoBtn:disabled{opacity:0.35;}
  #exportPdfBtn{background:var(--gold);color:var(--navy);margin-left:auto;}
  #exportPdfBtn:active{background:var(--gold-deep);}
  #resetBtn{background:transparent;color:#B7382B;border:1.5px solid #B7382B;}
  #pdfFallbackLink{background:var(--gold);color:var(--navy);text-decoration:none;}

  #lastActionToast{font-size:12px;color:var(--ink-soft);width:100%;order:5;min-height:16px;}
  #lastActionToast b{color:var(--ink);}

  /* ---------- Roster cards ---------- */
  .rosters{display:flex;flex-direction:column;gap:16px;}
  .roster-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .roster-card h2{margin:0 0 10px;font-size:17px;color:var(--navy);}
  .roster-card h2 input{
    font-size:17px;font-weight:800;color:var(--navy);border:none;border-bottom:2px dashed var(--line);
    padding:2px 0;width:220px;font-family:inherit;background:transparent;
  }
  .roster-card h2 input:focus{outline:none;border-bottom-color:var(--gold-deep);}
  .roster-card h2 input::placeholder{color:#9AA3B0;font-weight:600;}

  .add-player-form{display:flex;gap:8px;margin-bottom:12px;}
  .add-player-form input{
    flex:0 0 140px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  }
  .add-player-form button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;}

  .roster-list{display:flex;flex-direction:column;gap:8px;}
  .empty-note{color:#9AA3B0;font-size:13px;padding:10px 2px;}

  .player-row{
    display:flex;align-items:center;gap:8px;background:#F7F8FA;border:1px solid var(--line);
    border-radius:10px;padding:8px 8px 8px 10px;
  }
  .player-tag{
    font-weight:800;font-size:14px;color:var(--navy);min-width:38px;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 4px;flex-shrink:0;
  }
  .player-avg{min-width:64px;text-align:center;flex-shrink:0;}
  .player-avg .n{font-weight:800;font-size:15px;}
  .player-avg .l{font-size:9px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;}

  .pass-btns{display:flex;gap:6px;flex:1;justify-content:center;}
  .pass-btns button{
    width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-weight:800;font-size:16px;
    cursor:pointer;flex-shrink:0;
  }
  .pass-btns button:active{filter:brightness(0.85);transform:scale(0.94);}
  .v0{background:var(--v0);} .v1{background:var(--v1);} .v2{background:var(--v2);} .v3{background:var(--v3);}

  .del-btn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9AA3B0;
    font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;
  }

  /* ---------- Sub nav (tabs 2 & 3) ---------- */
  .panel-title{color:var(--navy);font-size:20px;margin:4px 0 12px;}
  .subnav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;margin-bottom:14px;width:fit-content;}
  .subnav-btn{border:none;background:transparent;padding:9px 16px;border-radius:7px;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .subnav-btn.active{background:var(--navy);color:#fff;}
  .subpage{display:none;}
  .subpage.active{display:block;}

  /* ---------- Averages table ---------- */
  table.stats{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.stats th, table.stats td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:13px;}
  table.stats th{background:var(--navy);color:#fff;font-weight:700;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;}
  table.stats td:first-child, table.stats th:first-child{text-align:left;padding-left:14px;}
  table.stats tr.team-row td{background:#F3EFDD;font-weight:800;}
  table.stats tr.team-row td:first-child{color:var(--navy);}
  table.stats td .avg{font-weight:800;font-size:15px;}
  table.stats td .meta{display:block;font-size:10px;color:var(--ink-soft);margin-top:1px;}
  table.stats td.total-cell{background:#FFF6DD;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- Log page ---------- */
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .log-player{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .log-player h3{margin:0 0 8px;font-size:14px;color:var(--navy);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    width:30px;height:30px;border-radius:7px;color:#fff;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }

  .empty-state{text-align:center;color:#9AA3B0;padding:40px 10px;font-size:14px;}

  @media (min-width:760px){
    .rosters{flex-direction:row;}
    .roster-card{flex:1;}
  }
</style>
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-row">
    <div class="brand">
      <span class="display">Billikens</span>
      <span class="sub">Passing Tracker</span>
    </div>
    <div class="set-flip">
      <div class="lbl">Recording</div>
      <div class="val tnum" id="headerSetVal">SET 1</div>
    </div>
  </div>
</header>

<nav class="tabs">
  <button data-tab="tab1" class="active" onclick="switchTab('tab1')">Live Entry</button>
  <button data-tab="tab2" onclick="switchTab('tab2')" id="tab2NavLabel">SLU Passing</button>
  <button data-tab="tab3" onclick="switchTab('tab3')" id="tab3NavLabel">Opponent Passing</button>
</nav>

<main>

  <!-- TAB 1: LIVE ENTRY -->
  <section id="tab1" class="tabpanel active">
    <div class="toolbar">
      <div class="set-picker" id="setPicker"></div>
      <button class="pill" id="undoBtn" onclick="undoLast()" disabled>↺ Undo Last Pass</button>
      <button class="pill" id="exportPdfBtn" onclick="exportPDF()">⬇ Export PDF Summary</button>
      <button class="pill" id="resetBtn" onclick="resetMatch()">New Match</button>
      <a id="pdfFallbackLink" href="#" style="display:none;" class="pill" target="_blank" rel="noopener"></a>
      <div id="lastActionToast"></div>
    </div>

    <div class="rosters">
      <div class="roster-card" data-team="home">
        <h2>Billikens</h2>
        <div class="add-player-form">
          <input id="homeNewPlayerInput" placeholder="Initials (e.g. JS)" maxlength="4">
          <button onclick="addPlayer('home')">Add Player</button>
        </div>
        <div id="homeRoster" class="roster-list"></div>
      </div>

      <div class="roster-card" data-team="away">
        <h2><input id="awayTeamNameInput" placeholder="Opponent team name" oninput="updateAwayName(this.value)"></h2>
        <div class="add-player-form">
          <input id="awayNewPlayerInput" placeholder="Jersey #" maxlength="3">
          <button onclick="addPlayer('away')">Add Player</button>
        </div>
        <div id="awayRoster" class="roster-list"></div>
      </div>
    </div>
  </section>

  <!-- TAB 2: SLU PASSING -->
  <section id="tab2" class="tabpanel">
    <h1 class="panel-title display" style="font-size:20px;">SLU Passing</h1>
    <div class="subnav">
      <button class="subnav-btn active" onclick="switchPage('tab2','avg')">Match Averages</button>
      <button class="subnav-btn" onclick="switchPage('tab2','log')">Attempt Log</button>
    </div>
    <div id="tab2-avg" class="subpage active"></div>
    <div id="tab2-log" class="subpage"></div>
  </section>

  <!-- TAB 3: OPPONENT PASSING -->
  <section id="tab3" class="tabpanel">
    <h1 class="panel-title display" style="font-size:20px;" id="tab3Title">Opponent Passing</h1>
    <div class="subnav">
      <button class="subnav-btn active" onclick="switchPage('tab3','avg')">Match Averages</button>
      <button class="subnav-btn" onclick="switchPage('tab3','log')">Attempt Log</button>
    </div>
    <div id="tab3-avg" class="subpage active"></div>
    <div id="tab3-log" class="subpage"></div>
  </section>

</main>

<script>
// ---------------------------------------------------------------
// STATE
// ---------------------------------------------------------------
const state = {
  currentSet: 1,
  teams: {
    home: { name: 'Billikens', players: [] },
    away: { name: '', players: [] }
  },
  undoStack: [] // { team, playerId }
};

const SET_COLORS = { 1:'var(--s1)', 2:'var(--s2)', 3:'var(--s3)', 4:'var(--s4)', 5:'var(--s5)' };
// RGB equivalents of the SET_COLORS hexes above, for use in the PDF (jsPDF can't read CSS variables)
const SET_RGB = {
  1: [45, 95, 163],   // #2D5FA3
  2: [122, 79, 190],  // #7A4FBE
  3: [30, 142, 126],  // #1E8E7E
  4: [201, 121, 30],  // #C9791E
  5: [194, 59, 107]   // #C23B6B
};
const SLU_BLUE_RGB = [0, 61, 165]; // official SLU Blue, PMS 293C
const STORAGE_KEY = 'billikens-passing-tracker-state-v1';

function uid(){ return Math.random().toString(36).slice(2,10); }

function findPlayer(team, id){
  return state.teams[team].players.find(p => p.id === id);
}

function awayDisplayName(){
  const n = state.teams.away.name.trim();
  return n ? n : 'Opponent';
}

// ---------------------------------------------------------------
// PERSISTENCE (auto-save to this browser so a refresh doesn't lose data)
// ---------------------------------------------------------------
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    // Storage unavailable (e.g. private browsing, or an embedded preview
    // that blocks it) — the app still works, it just won't persist.
    console.warn('Could not save match data:', e);
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(saved && saved.teams){
      state.currentSet = saved.currentSet || 1;
      state.teams = saved.teams;
      state.undoStack = saved.undoStack || [];
      return true;
    }
  }catch(e){
    console.warn('Could not load saved match data:', e);
  }
  return false;
}

// ---------------------------------------------------------------
// MUTATIONS
// ---------------------------------------------------------------
function addPlayer(team){
  const inputId = team === 'home' ? 'homeNewPlayerInput' : 'awayNewPlayerInput';
  const input = document.getElementById(inputId);
  const label = input.value.trim().toUpperCase();
  if(!label) return;
  state.teams[team].players.push({ id: uid(), label, passes: [] });
  input.value = '';
  renderRoster(team);
  renderStatsTables();
  renderLogs();
  saveState();
}

function removePlayer(team, id){
  state.teams[team].players = state.teams[team].players.filter(p => p.id !== id);
  state.undoStack = state.undoStack.filter(a => !(a.team===team && a.playerId===id));
  renderRoster(team);
  renderStatsTables();
  renderLogs();
  updateUndoButton();
  saveState();
}

function addPass(team, playerId, value){
  const player = findPlayer(team, playerId);
  if(!player) return;
  player.passes.push({ set: state.currentSet, value, ts: Date.now() });
  state.undoStack.push({ team, playerId });
  renderRoster(team);
  renderStatsTables();
  renderLogs();
  updateUndoButton();
  const t = document.getElementById('lastActionToast');
  t.innerHTML = `Last: <b>${player.label}</b> +${value} pt pass · Set ${state.currentSet}`;
  saveState();
}

function undoLast(){
  const last = state.undoStack.pop();
  if(!last) return;
  const player = findPlayer(last.team, last.playerId);
  if(!player){ updateUndoButton(); return; }
  const removed = player.passes.pop();
  renderRoster(last.team);
  renderStatsTables();
  renderLogs();
  updateUndoButton();
  const t = document.getElementById('lastActionToast');
  if(removed){
    t.innerHTML = `Undid: <b>${player.label}</b> — ${removed.value} pt pass (Set ${removed.set})`;
  }
  saveState();
}

function updateUndoButton(){
  document.getElementById('undoBtn').disabled = state.undoStack.length === 0;
}

function setCurrentSet(n){
  state.currentSet = n;
  document.querySelectorAll('#setPicker button').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.set) === n);
  });
  document.getElementById('headerSetVal').textContent = 'SET ' + n;
  saveState();
}

function updateAwayName(val){
  state.teams.away.name = val;
  document.getElementById('tab3NavLabel').textContent = awayDisplayName() + ' Passing';
  document.getElementById('tab3Title').textContent = state.teams.away.name.trim()
    ? awayDisplayName() + "'s Passing" : 'Opponent Passing';
  saveState();
}

function resetMatch(){
  if(!confirm('Start a new match? This clears all players and recorded passes.')) return;
  state.currentSet = 1;
  state.teams.home = { name:'Billikens', players: [] };
  state.teams.away = { name:'', players: [] };
  state.undoStack = [];
  document.getElementById('awayTeamNameInput').value = '';
  updateAwayName('');
  setCurrentSet(1);
  renderRoster('home'); renderRoster('away');
  renderStatsTables(); renderLogs(); updateUndoButton();
  document.getElementById('lastActionToast').innerHTML = '';
  saveState();
}

// ---------------------------------------------------------------
// STATS
// ---------------------------------------------------------------
function computeStats(player){
  const bySet = {};
  for(let s=1;s<=5;s++) bySet[s] = { att:0, pts:0, avg:null };
  let totalAtt=0, totalPts=0;
  player.passes.forEach(p=>{
    bySet[p.set].att++; bySet[p.set].pts += p.value;
    totalAtt++; totalPts += p.value;
  });
  for(let s=1;s<=5;s++){ if(bySet[s].att) bySet[s].avg = bySet[s].pts / bySet[s].att; }
  return { bySet, total: { att: totalAtt, pts: totalPts, avg: totalAtt ? totalPts/totalAtt : null } };
}

function getSetsWithData(team){
  const used = new Set();
  state.teams[team].players.forEach(p => p.passes.forEach(pass => used.add(pass.set)));
  if(used.size === 0) return [1];
  return Array.from(used).sort((a,b)=>a-b);
}

function fmtAvg(v){ return v===null || v===undefined ? '—' : v.toFixed(2); }

// ---------------------------------------------------------------
// RENDER: ROSTER (Tab 1)
// ---------------------------------------------------------------
function renderRoster(team){
  const container = document.getElementById(team === 'home' ? 'homeRoster' : 'awayRoster');
  const players = state.teams[team].players;
  if(players.length === 0){
    container.innerHTML = `<div class="empty-note">No players added yet.</div>`;
    return;
  }
  container.innerHTML = players.map(p => {
    const stats = computeStats(p);
    return `
      <div class="player-row">
        <div class="player-tag">${escapeHtml(p.label)}</div>
        <div class="player-avg">
          <div class="n tnum">${fmtAvg(stats.total.avg)}</div>
          <div class="l">Avg</div>
        </div>
        <div class="pass-btns">
          <button class="v0" onclick="addPass('${team}','${p.id}',0)">0</button>
          <button class="v1" onclick="addPass('${team}','${p.id}',1)">1</button>
          <button class="v2" onclick="addPass('${team}','${p.id}',2)">2</button>
          <button class="v3" onclick="addPass('${team}','${p.id}',3)">3</button>
        </div>
        <button class="del-btn" onclick="removePlayer('${team}','${p.id}')" title="Remove player">×</button>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------------------------------------------------------------
// RENDER: AVERAGES TABLES (Tab 2 / Tab 3, page 1)
// ---------------------------------------------------------------
function renderStatsTables(){
  renderAvgTable('home', 'tab2-avg');
  renderAvgTable('away', 'tab3-avg');
}

function renderAvgTable(team, containerId){
  const container = document.getElementById(containerId);
  const players = state.teams[team].players;
  const setsUsed = getSetsWithData(team);

  if(players.length === 0){
    container.innerHTML = `<div class="empty-state">Add players on Live Entry to see stats here.</div>`;
    return;
  }

  let html = `<div class="table-wrap"><table class="stats"><thead><tr><th>Player</th>`;
  setsUsed.forEach(s => html += `<th>Set ${s}</th>`);
  html += `<th>Total</th></tr></thead><tbody>`;

  // per-player rows
  const teamTotals = {};
  setsUsed.forEach(s => teamTotals[s] = { att:0, pts:0 });
  let teamAllAtt = 0, teamAllPts = 0;

  players.forEach(p => {
    const stats = computeStats(p);
    html += `<tr><td>${escapeHtml(p.label)}</td>`;
    setsUsed.forEach(s => {
      const c = stats.bySet[s];
      teamTotals[s].att += c.att; teamTotals[s].pts += c.pts;
      html += `<td><span class="avg tnum">${fmtAvg(c.avg)}</span><span class="meta">${c.att} att · ${c.pts} pts</span></td>`;
    });
    teamAllAtt += stats.total.att; teamAllPts += stats.total.pts;
    html += `<td class="total-cell"><span class="avg tnum">${fmtAvg(stats.total.avg)}</span><span class="meta">${stats.total.att} att · ${stats.total.pts} pts</span></td></tr>`;
  });

  // team total row
  html += `<tr class="team-row"><td>TEAM</td>`;
  setsUsed.forEach(s => {
    const t = teamTotals[s];
    const avg = t.att ? t.pts/t.att : null;
    html += `<td><span class="avg tnum">${fmtAvg(avg)}</span><span class="meta">${t.att} att · ${t.pts} pts</span></td>`;
  });
  const teamAvg = teamAllAtt ? teamAllPts/teamAllAtt : null;
  html += `<td class="total-cell"><span class="avg tnum">${fmtAvg(teamAvg)}</span><span class="meta">${teamAllAtt} att · ${teamAllPts} pts</span></td></tr>`;

  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

// ---------------------------------------------------------------
// RENDER: LOG PAGES (Tab 2 / Tab 3, page 2)
// ---------------------------------------------------------------
function renderLogs(){
  renderLog('home', 'tab2-log');
  renderLog('away', 'tab3-log');
}

function renderLog(team, containerId){
  const container = document.getElementById(containerId);
  const players = state.teams[team].players;

  if(players.length === 0){
    container.innerHTML = `<div class="empty-state">Add players on Live Entry to see the attempt log here.</div>`;
    return;
  }

  let html = `<div class="legend">`;
  for(let s=1;s<=5;s++){
    html += `<span><i style="background:${SET_COLORS[s]}"></i>Set ${s}</span>`;
  }
  html += `</div>`;

  players.forEach(p => {
    html += `<div class="log-player"><h3>${escapeHtml(p.label)} <span style="color:#9AA3B0;font-weight:600;">(${p.passes.length} attempts)</span></h3>`;
    if(p.passes.length === 0){
      html += `<div class="empty-note" style="padding:0;">No passes recorded yet.</div>`;
    } else {
      html += `<div class="chip-row">`;
      p.passes.forEach(pass => {
        html += `<div class="chip" style="background:${SET_COLORS[pass.set]}" title="Set ${pass.set}">${pass.value}</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  container.innerHTML = html;
}

// ---------------------------------------------------------------
// TAB / PAGE NAVIGATION
// ---------------------------------------------------------------
function switchTab(tabId){
  document.querySelectorAll('.tabpanel').forEach(el => el.classList.toggle('active', el.id === tabId));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
}

function switchPage(tabId, page){
  const avgId = tabId + '-avg', logId = tabId + '-log';
  document.getElementById(avgId).classList.toggle('active', page === 'avg');
  document.getElementById(logId).classList.toggle('active', page === 'log');
  const nav = document.getElementById(avgId).parentElement.querySelector('.subnav');
  nav.querySelectorAll('.subnav-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && page==='avg') || (i===1 && page==='log')));
}

// ---------------------------------------------------------------
// PDF EXPORT
// ---------------------------------------------------------------
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const marginX = 40;
  let y = 50;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.setTextColor(...SLU_BLUE_RGB);
  doc.text('Billikens Passing Report', marginX, y);
  doc.setTextColor(20);
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`Generated: ${new Date().toLocaleString()}`, marginX, y);
  doc.text(`Current set: ${state.currentSet}`, 430, y);
  y += 22;
  doc.setTextColor(20);

  // Page 1: match averages for both teams
  y = drawTeamSection(doc, 'home', 'Billikens', y);
  y += 26;
  if(y > 660){ doc.addPage(); y = 50; }
  y = drawTeamSection(doc, 'away', awayDisplayName(), y);

  // Page 2+: full attempt log for both teams
  doc.addPage();
  y = 50;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.setTextColor(...SLU_BLUE_RGB);
  doc.text('Attempt Logs', marginX, y);
  doc.setTextColor(20);
  y += 16;
  y = drawSetLegend(doc, marginX, y);
  y += 14;

  y = drawTeamLog(doc, 'home', 'Billikens', y);
  y += 20;
  if(y > 660){ doc.addPage(); y = 50; }
  y = drawTeamLog(doc, 'away', awayDisplayName(), y);

  const filename = 'billikens-passing-report-' + new Date().toISOString().slice(0,10) + '.pdf';
  openOrDownloadPdf(doc, filename);
}

function drawSetLegend(doc, marginX, y){
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  let x = marginX;
  for(let s=1; s<=5; s++){
    doc.setFillColor(...SET_RGB[s]);
    doc.roundedRect(x, y - 8, 9, 9, 1.5, 1.5, 'F');
    doc.setTextColor(80);
    doc.text('Set ' + s, x + 13, y);
    x += 55;
  }
  doc.setTextColor(20);
  return y;
}

function openOrDownloadPdf(doc, filename){
  // Sandboxed previews (like the in-chat viewer) can block a forced file
  // download, so open the PDF in a new tab instead — from there it can be
  // saved via the browser's Share / Save menu. This also works normally
  // once the file is opened directly in Safari.
  const blob = doc.output('blob');
  const blobUrl = URL.createObjectURL(blob);
  const fallback = document.getElementById('pdfFallbackLink');

  let opened = null;
  try{
    opened = window.open(blobUrl, '_blank');
  }catch(e){
    opened = null;
  }

  if(!opened || opened.closed){
    // Popup was blocked — show a manual link the user can tap themselves.
    fallback.href = blobUrl;
    fallback.download = filename;
    fallback.textContent = '📄 Tap here to open your PDF';
    fallback.style.display = 'inline-block';
  } else {
    fallback.style.display = 'none';
  }
}

function drawTeamSection(doc, team, title, y){
  const marginX = 40;
  const players = state.teams[team].players;
  const setsUsed = getSetsWithData(team);

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.setTextColor(...SLU_BLUE_RGB);
  doc.text(title + ' Passing', marginX, y);
  doc.setTextColor(20);
  y += 16;

  if(players.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('No players recorded.', marginX, y);
    return y + 14;
  }

  const colWidths = [90, ...setsUsed.map(()=>72), 90];
  const headers = ['Player', ...setsUsed.map(s => 'Set ' + s), 'Total'];

  doc.setFontSize(9); doc.setFont('helvetica','bold');
  let x = marginX;
  headers.forEach((h,i) => { doc.text(h, x, y); x += colWidths[i]; });
  y += 5;
  doc.setDrawColor(180); doc.setLineWidth(0.7);
  doc.line(marginX, y, x, y);
  y += 13;

  doc.setFont('helvetica','normal');
  const teamTotals = {}; setsUsed.forEach(s => teamTotals[s] = {att:0,pts:0});
  let teamAllAtt=0, teamAllPts=0;

  players.forEach(p => {
    const stats = computeStats(p);
    let x = marginX;
    doc.text(p.label, x, y); x += colWidths[0];
    setsUsed.forEach((s,i) => {
      const c = stats.bySet[s];
      teamTotals[s].att += c.att; teamTotals[s].pts += c.pts;
      const txt = c.att ? `${c.avg.toFixed(2)} (${c.att}/${c.pts})` : '-';
      doc.text(txt, x, y); x += colWidths[i+1];
    });
    teamAllAtt += stats.total.att; teamAllPts += stats.total.pts;
    const totTxt = stats.total.att ? `${stats.total.avg.toFixed(2)} (${stats.total.att}/${stats.total.pts})` : '-';
    doc.text(totTxt, x, y);
    y += 15;
    if(y > 760){ doc.addPage(); y = 50; }
  });

  doc.setFont('helvetica','bold');
  let xTeam = marginX;
  doc.text('TEAM', xTeam, y); xTeam += colWidths[0];
  setsUsed.forEach((s,i) => {
    const t = teamTotals[s];
    const avg = t.att ? t.pts/t.att : null;
    const txt = t.att ? `${avg.toFixed(2)} (${t.att}/${t.pts})` : '-';
    doc.text(txt, xTeam, y); xTeam += colWidths[i+1];
  });
  const teamAvg = teamAllAtt ? teamAllPts/teamAllAtt : null;
  const teamTxt = teamAllAtt ? `${teamAvg.toFixed(2)} (${teamAllAtt}/${teamAllPts})` : '-';
  doc.text(teamTxt, xTeam, y);
  y += 14;

  return y;
}

function drawTeamLog(doc, team, title, y){
  const marginX = 40;
  const pageRightEdge = 572; // letter width (612pt) minus right margin
  const chip = 15;      // chip width/height
  const chipGap = 4;    // gap between chips
  const rowGap = 12;    // gap between a player's chip row and the next player
  const players = state.teams[team].players;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.setTextColor(...SLU_BLUE_RGB);
  doc.text(title + ' Passing — Attempt Log', marginX, y);
  doc.setTextColor(20);
  y += 18;

  if(players.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('No players recorded.', marginX, y);
    return y + 14;
  }

  players.forEach(p => {
    if(y > 730){ doc.addPage(); y = 50; }

    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(20);
    doc.text(`${p.label}`, marginX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(`${p.passes.length} attempt${p.passes.length === 1 ? '' : 's'}`, marginX + 34, y);
    doc.setTextColor(20);
    y += 6;

    if(p.passes.length === 0){
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140);
      doc.text('No passes recorded.', marginX, y + 12);
      doc.setTextColor(20);
      y += rowGap + 14;
      return;
    }

    y += 14; // room for first chip row
    let x = marginX;

    p.passes.forEach(pass => {
      if(x + chip > pageRightEdge){ x = marginX; y += chip + chipGap; }
      if(y > 760){ doc.addPage(); y = 50; x = marginX; }

      doc.setFillColor(...SET_RGB[pass.set]);
      doc.roundedRect(x, y - chip, chip, chip, 2.5, 2.5, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
      doc.text(String(pass.value), x + chip/2, y - chip/2 + 3, { align: 'center' });
      doc.setTextColor(20);

      x += chip + chipGap;
    });

    y += rowGap + 4;
  });

  return y;
}

}
